plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = 'HomeCorePackages'
        url = uri('https://maven.pkg.github.com/LKDM7/HomeCore')
        credentials {
            username = providers.gradleProperty('githubUser').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
            password = providers.gradleProperty('githubToken').orElse(providers.environmentVariable('HOMELINK_PACKAGES_TOKEN')).orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
        }
        content { includeGroup 'fr.lkdm.homecore' }
    }

    maven {
        name = 'EnergyPackages'
        url = uri('https://maven.pkg.github.com/LKDM7/HomeLink-Energy')
        credentials {
            username = providers.gradleProperty('githubUser').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
            password = providers.gradleProperty('githubToken').orElse(providers.environmentVariable('HOMELINK_PACKAGES_TOKEN')).orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
        }
        content { includeGroup 'fr.lkdm.homelink.energy' }
    }


    mavenCentral()
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } }
    maven { url = 'https://maven.shedaniel.me/'; content { includeGroup 'me.shedaniel'; includeGroup 'me.shedaniel.cloth' } }
    maven { url = 'https://maven.architectury.dev/'; content { includeGroup 'dev.architectury' } }
    maven { url = 'https://maven.fabricmc.net/'; content { includeGroup 'net.fabricmc' } }
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// In-game verification (GameTests) lives in its own source set and development-only mod;
// it is never packaged in the release JAR.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

// JEI and REI are optional client integrations: compiled against their APIs, never embedded or required.
// Pass -PwithJei or -PwithRei to load one of them in development runs.
def withJei = providers.gradleProperty('withJei').isPresent()
def withRei = providers.gradleProperty('withRei').isPresent()
dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    // Information pages use REI's built-in display type, shipped in the full REI artifact.
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { transitive = false }
    // REI annotates its API with net.fabricmc.api.Environment; only that annotation type is needed to compile.
    compileOnly("net.fabricmc:fabric-loader:0.16.14") { transitive = false }
    if (withJei) runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    if (withRei) runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    implementation "fr.lkdm.homecore:homecore:${homecore_version}"
    // Required at runtime: machines only run on HE supplied by HomeLink Energy networks.
    runtimeOnly "fr.lkdm.homelink.energy:homelink_energy:${energy_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Tests reading project files (translations, sources) resolve them from here.
    systemProperty 'homelink_farm.projectDir', project.projectDir.absolutePath
    testLogging { events 'passed', 'failed', 'skipped' }
}

tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Xlint:unchecked'])
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gametest

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        homelink_farm_gametest {
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods."${mod_id}"]
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods."${mod_id}"]
        }
        // Headless GameTestServer: runs every HomeLink Farm GameTest then exits (non-zero on failure).
        gameTestServer {
            type = 'gameTestServer'
            loadedMods = [mods."${mod_id}", mods.homelink_farm_gametest]
            gameDirectory = file('build/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'homelink_farm_gametest'
        }
        // Restart check: run with -PpersistencePass=write, then -PpersistencePass=read (same world, two processes).
        persistence {
            type = 'gameTestServer'
            loadedMods = [mods."${mod_id}", mods.homelink_farm_gametest]
            gameDirectory = file('build/persistence')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'homelink_farm_persistence'
            systemProperty 'homelink_farm.persistencePass', providers.gradleProperty('persistencePass').getOrElse('read')
        }
        // Real client: builds a farm in a fresh flat world, drives the screens, saves screenshots, quits.
        clientSmoke {
            client()
            loadedMods = [mods."${mod_id}", mods.homelink_farm_gametest]
            gameDirectory = file('build/client-smoke')
            systemProperty 'homelink_farm.clientSmoke', providers.gradleProperty('smokeScenario').getOrElse('full')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        homecore_version_range : homecore_version_range,
        jei_version_range      : jei_version_range,
        rei_version_range      : rei_version_range,
        energy_version_range   : energy_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def gametestServerProperties = layout.buildDirectory.file('gametest/server.properties')
tasks.named('runGameTestServer') {
    doFirst {
        def properties = gametestServerProperties.get().asFile
        if (!properties.exists()) {
            properties.parentFile.mkdirs()
            properties.setText('', 'UTF-8')
        }
    }
}

def persistenceProperties = layout.buildDirectory.file('persistence/server.properties')
tasks.named('runPersistence') {
    doFirst {
        def properties = persistenceProperties.get().asFile
        if (!properties.exists()) {
            properties.parentFile.mkdirs()
            properties.setText('', 'UTF-8')
        }
    }
}

def clientSmokeLog = layout.buildDirectory.file('client-smoke/logs/latest.log')
def clientSmokeOptions = layout.buildDirectory.file('client-smoke/options.txt')
// Game language of the smoke client (e.g. -PsmokeLanguage=fr_fr to check the French translation in game).
def smokeLanguage = providers.gradleProperty('smokeLanguage').getOrElse('en_us')
// Other mods to load next to HomeLink Farm, e.g. -PsmokeMods=../Storage/build/libs/storage.jar (comma separated).
def smokeMods = providers.gradleProperty('smokeMods').getOrElse('').split(',').findAll { it.trim() }.collect { file(it.trim()) }
tasks.named('runClientSmoke') {
    doFirst {
        def options = clientSmokeOptions.get().asFile
        options.parentFile.mkdirs()
        options.setText("onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:4\nsimulationDistance:5\nmaxFps:60\nguiScale:2\nlang:${smokeLanguage}\n", 'UTF-8')
        new File(options.parentFile, 'screenshots').deleteDir()
        def mods = new File(options.parentFile, 'mods')
        mods.deleteDir()
        smokeMods.each { jar ->
            if (!jar.isFile()) throw new GradleException("smokeMods: no such file $jar")
            mods.mkdirs()
            java.nio.file.Files.copy(jar.toPath(), new File(mods, jar.name).toPath())
        }
    }
    doLast {
        def log = clientSmokeLog.get().asFile
        def text = log.exists() ? log.getText('UTF-8') : ''
        if (!text.contains('HOMELINK_FARM_CLIENT_SMOKE_OK') || text.contains('HOMELINK_FARM_CLIENT_SMOKE_FAILED')) {
            throw new GradleException('Client smoke failed; inspect build/client-smoke/logs/latest.log')
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

if (providers.gradleProperty('withStorage').isPresent()) {
    dependencies { runtimeOnly 'fr.lkdm.homelink.storage:homelink_storage:1.1.0' }
}

def releaseJarForVerification = tasks.named('jar', Jar).flatMap { it.archiveFile }
def versionForVerification = providers.gradleProperty('mod_version').get()
def coreRangeForVerification = providers.gradleProperty('homecore_version_range').get()
def energyRangeForVerification = providers.gradleProperty('energy_version_range').get()
tasks.register('verifyReleaseJar') {
    group = 'verification'
    dependsOn tasks.named('jar')
    inputs.file(releaseJarForVerification)
    doLast {
        new java.util.zip.ZipFile(releaseJarForVerification.get().asFile).withCloseable { archive ->
            def names = archive.entries().collect { it.name }
            if (names.any { it.startsWith('fr/lkdm/homecore/') || it.contains('/gametest/') || it.startsWith('data/homelink_farm_gametest/') || it.startsWith('org/junit/') }) {
                throw new GradleException('Dependency or test content found in release JAR.')
            }
            ['fr/lkdm/homelink/farm/HomeLinkFarm.class', 'META-INF/neoforge.mods.toml', 'META-INF/LICENSE',
             'assets/homelink_farm/lang/en_us.json', 'assets/homelink_farm/lang/fr_fr.json'].each { entry ->
                if (!names.contains(entry)) throw new GradleException("Missing release entry: ${entry}")
            }
            def metadata = archive.getInputStream(archive.getEntry('META-INF/neoforge.mods.toml')).withCloseable { it.getText('UTF-8') }
            if (metadata.contains('${') || !metadata.contains('version = "' + versionForVerification + '"')
                    || !metadata.contains('versionRange = "' + coreRangeForVerification + '"')
                    || !metadata.contains('versionRange = "' + energyRangeForVerification + '"')) {
                throw new GradleException('Release identity or dependency metadata mismatch.')
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyReleaseJar'), tasks.named('gametestClasses') }
tasks.withType(Jar).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
