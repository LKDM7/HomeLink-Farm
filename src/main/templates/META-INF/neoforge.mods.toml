modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
credits = "Built on HomeCore (https://github.com/LKDM7/HomeCore)"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "homecore"
type = "required"
reason = "HomeLink Farm publishes its devices, metrics, actions and events through the HomeCore API."
versionRange = "${homecore_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "homelink_energy"
type = "required"
reason = "Every HomeLink Farm machine runs on HE supplied by HomeLink Energy (solar panels, wind turbines, batteries, cables)."
versionRange = "${energy_version_range}"
ordering = "NONE"
side = "BOTH"
